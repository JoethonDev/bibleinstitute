server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    resolver 127.0.0.11 valid=30s;

    # ── Static files ──────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Blue/green upstream state ────────────────────────────
    # The deploy/bootstrap script writes a safe `set` directive to
    # /etc/nginx/runtime/nginx-active-upstream.conf, e.g.:
    #   set $lms_app_upstream http://lms-app-blue:8000;
    # Nginx uses Docker DNS resolver (127.0.0.11) and the variable
    # proxy_pass so it can start before any application slot exists.
    include /etc/nginx/runtime/nginx-active-upstream.conf;

    # ── Application proxy ─────────────────────────────────────
    location / {
        proxy_pass $lms_app_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
