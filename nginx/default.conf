# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS application server ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size       2G;
    proxy_request_buffering    off;
    client_body_timeout        1800s;
    proxy_read_timeout         1800s;
    proxy_send_timeout         1800s;
    send_timeout               1800s;

    resolver 127.0.0.11 valid=30s;

    # ── Static files ──────────────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Blue/green upstream state ────────────────────────────
    # The deploy/bootstrap script writes a safe `set` directive to
    # /etc/nginx/runtime/nginx-active-upstream.conf, e.g.:
    #   set $lms_app_upstream http://lms-app-blue:8000;
    # Nginx uses Docker DNS resolver (127.0.0.11) and the variable
    # proxy_pass so it can start before any application slot exists.
    include /etc/nginx/runtime/nginx-active-upstream.conf;

    # ── Application proxy ─────────────────────────────────────
    location / {
        proxy_pass $lms_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
