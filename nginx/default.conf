# -- HTTP -> HTTPS redirect -----------------------------------------
log_format lms_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';

map $arg_v $static_cache_control {
    ""      "public, max-age=0, must-revalidate";
    default "public, immutable";
}

# -- Trusted ingress identity --------------------------------
# Only Cloudflare's published ranges may supply CF-Connecting-IP. Direct VPS
# clients keep their socket address; their CF-Connecting-IP, X-Forwarded-For
# and X-Real-IP headers are ignored. Add exactly one set_real_ip_from line for
# each configured extra internal hop (for example an operator load balancer).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# -- Monitor subdomain (generated at setup time) -----------------
# The monitoring server block is generated by deploy/setup_infrastructure.sh
# into /etc/nginx/runtime/nginx-monitoring-server.conf from the configured
# primary domain. It owns the exact HTTPS host `monitor.<domain>/` (root
# path /) and is the ONLY Nginx server that proxies to the Dozzle container.
# The primary application server below must not route any path to Dozzle.
# This include is parsed at configuration load, so the runtime file must
# exist before Nginx starts. It is included after the application server below
# so the application remains the default for all non-monitor hostnames.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# -- HTTPS application server -------------------------------------
server {
    listen 443 ssl http2 default_server;
    server_name _;

    # Do not log query strings or Referer values. Mobile manifest URLs carry
    # short-lived viewing-session capabilities in their query parameters.
    access_log /dev/stdout lms_safe;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size       2G;
    proxy_request_buffering    off;
    client_body_timeout        1800s;
    proxy_read_timeout         1800s;
    proxy_send_timeout         1800s;
    send_timeout               1800s;

    resolver 127.0.0.11 valid=30s;

    # -- Static files ------------------------------------------
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control $static_cache_control;
    }

    # -- Blue/green upstream state ----------------------------
    # The infrastructure setup/deployment scripts write a safe `set` directive to
    # /etc/nginx/runtime/nginx-active-upstream.conf, e.g.:
    #   set $lms_app_upstream http://lms-app-blue:8000;
    # Nginx uses Docker DNS resolver (127.0.0.11) and the variable
    # proxy_pass so it can start before any application slot exists.
    include /etc/nginx/runtime/nginx-active-upstream.conf;

    # -- Application proxy -------------------------------------
    location / {
        proxy_pass $lms_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Overwrite the canonical identity instead of forwarding client-supplied
        # chains; Django accepts X-Client-IP only from the internal Nginx peer.
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}

# Keep this exact-host server after the application default server. Nginx
# still selects it by exact `server_name`, while unmatched HTTPS hosts remain
# on the application server rather than falling into the monitor host.
include /etc/nginx/runtime/nginx-monitoring-server.conf;
