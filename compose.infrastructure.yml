services:
  # ── PostgreSQL 18 ───────────────────────────────────────────────
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
        format: raw
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_database}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
    volumes:
      - lms_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lms_network
    cpus: 0.75
    mem_limit: 2G
    shm_size: 256M

  # ── Redis (Celery broker & Django cache backend) ───────────────
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - lms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms_network
    cpus: 0.25
    mem_limit: 512M

  # ── Nginx proxy (static serving + blue/green app routing) ──────
  # The active application slot is controlled by the runtime bind-mounted
  # nginx-active-upstream.conf file. The setup/deployment scripts write a safe
  # Nginx `set $lms_app_upstream ...` directive there and reloads Nginx.
  # LMS_RUNTIME_DIR defaults to ./runtime — the setup script
  # must create that directory and the state file before Nginx starts.
  # TLS certificate directory must contain fullchain.pem and privkey.pem;
  # on a production server point NGINX_TLS_CERT_DIR to the Let's Encrypt
  # live directory (e.g. /etc/letsencrypt/live/bibleinstitute-eg.org).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - lms_static_data:/usr/share/nginx/html/static:ro
      # TLS certificate directory (read-only).
      - type: bind
        source: ${NGINX_TLS_CERT_DIR:-./certs}
        target: /etc/nginx/certs
        read_only: true
      # Bind-mount the runtime directory so Nginx can read the
      # blue/green upstream state from a file outside the image.
      # The deploy script writes ${LMS_RUNTIME_DIR}/nginx-active-upstream.conf.
      - type: bind
        source: ${LMS_RUNTIME_DIR:-./runtime}
        target: /etc/nginx/runtime
        read_only: true
    networks:
      - lms_network
    cpus: 0.25
    mem_limit: 256M

  # ── Dozzle live Docker log viewer (read-only) ────────────────
  # Lightweight authenticated container log viewer exposed ONLY through the
  # existing Nginx HTTPS server on the dedicated monitor.<primary-domain>
  # host at the site root (https://monitor.<primary-domain>/). No host port
  # is published and Dozzle actions/shell access stay disabled
  # (DOZZLE_ENABLE_ACTIONS is not set). Dozzle is live log viewing only: it
  # does not retain or index historical logs, so it is not an offline
  # log-search/retention database.
  dozzle:
    image: amir20/dozzle:v10.7.2@sha256:01f9018ffdaa0ec523f9a91dea3eff65b25cdb5f0566ac6d5a2cb4cf591e35e9
    restart: unless-stopped
    # Container port 8080 is reachable only inside Docker networks; no
    # host `ports:` mapping is published for Dozzle.
    expose:
      - "8080"
    environment:
      # Root base path: the monitor.<primary-domain> host proxies the site
      # root to Dozzle, so requests must not be redirected to a sub-path.
      DOZZLE_BASE: /
      # Simple file authentication: /data/users.yml (generated outside Git
      # by the monitoring setup script) is required before startup.
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 12h
      DOZZLE_NO_ANALYTICS: "true"
      # Dozzle reaches the Docker API only through the socket proxy on the
      # isolated dozzle_control network; it never mounts /var/run/docker.sock.
      DOZZLE_REMOTE_HOST: tcp://dozzle-socket-proxy:2375
      DOZZLE_HOSTNAME: LMS Docker Logs
    volumes:
      # Read-write runtime data/auth directory (bind source defaults to
      # ./runtime/dozzle). The setup script creates the directory with mode
      # 700 and users.yml with mode 600 BEFORE this service is started.
      - type: bind
        source: ${DOZZLE_DATA_DIR:-./runtime/dozzle}
        target: /data
    networks:
      - lms_network
      - dozzle_control
    depends_on:
      dozzle-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 0.25
    mem_limit: 256M

  # ── Docker socket proxy (minimal read-only API gateway) ──────
  # Grants Dozzle only the Docker API access it needs (container list/logs,
  # info, events, ping, version). POST and every other endpoint stay
  # disabled, so no action/shell/container-mutation route exists. The proxy
  # is attached ONLY to the internal dozzle_control network and publishes no
  # port, so it can never be reached from lms_network, the host, or the
  # public internet. The tecnativa image needs no privileged mode: it proxies
  # HTTP to the read-only mounted Docker socket.
  dozzle-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Explicit minimal read-only access set (all other proxy endpoints
      # default to disabled).
      CONTAINERS: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    networks:
      - dozzle_control
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cpus: 0.10
    mem_limit: 128M

volumes:
  lms_postgres_data:
    name: lms_postgres_data
  lms_redis_data:
    name: lms_redis_data
  lms_static_data:
    external: true
    name: lms_static_data

networks:
  lms_network:
    external: true
    name: lms_network
  # Internal network connecting Dozzle to the socket proxy only. No gateway,
  # no host/public exposure; the socket proxy is never on lms_network.
  dozzle_control:
    name: dozzle_control
    internal: true
