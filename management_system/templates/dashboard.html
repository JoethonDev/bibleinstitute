{% extends 'admin_panel.html' %}
{% load crispy_forms_tags %}

{% block body %}
    <div class="container-fluid" id="content">
        <h2>{{ header }}</h2>
        <div class="user-table">
            <div class="options d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
                {% if not submission_user %}
                    <button class="btn btn-primary mb-4 mb-md-0" hx-get="{{ url }}create" hx-push-url="true" hx-trigger="click" hx-target="#display-page" hx-select="#content">Create a {{ view }}</button>
                {% endif %}                
                <div class="filters d-flex flex-column flex-md-row " hx-include=".filters-fields">
                    <div class="row">
                        {% for filter in filters %}
                            <div class="col-12 col-md-auto mb-2">
                                {% include filter %}
                            </div>
                        {% endfor %}

                    </div>
                    
                </div>
            </div>

            {% include 'table_rendering.html' %}
        </div>

        {% include 'pagination.html' %}

    </div>
{% endblock %}
