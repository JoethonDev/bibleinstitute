{% load i18n %}
<div>
    {% if not is_root %}
    <div class="mb-3">
        <button class="btn btn-outline-secondary" 
                hx-get="{% url 'navigate-folder' parent_folder %}{% if folders_only %}?folders_only=true{% endif %}" 
                hx-trigger="click" 
                hx-swap="innerHTML" 
                hx-target="#drive-files">
            <i class="fas fa-arrow-left me-2"></i> 
            {% translate "Back" %} 
        </button>
    </div>
    {% endif %}

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-2">
        {% for data in drive %}
        <div class="col">
            <div class="card admin-card text-center h-100 drive-item is-clickable">
                <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                    {% if data.type == 'folder' %} 
                        <div class="drive-icon folder-icon text-warning w-100" 
                             hx-get="{% url 'navigate-folder' data.id %}{% if folders_only %}?folders_only=true{% endif %}" 
                             hx-trigger="click" 
                             hx-swap="innerHTML" 
                             hx-target="#drive-files">
                            <i class="fas fa-folder fa-2x"></i>
                        </div>
                    {% else %}
                        <div class="drive-icon file-icon text-muted w-100" 
                             data-id="{{ data.id }}"
                             @click="addFile($event)"
                             role="button"
                             tabindex="0">
                            <i class="fas fa-file-alt fa-2x"></i>
                        </div>
                    {% endif %}
                    <div class="card-title drive-title mt-2 w-100" title="{{ data.name }}">
                        {{ data.name }}
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info text-center">
                <i class="fas fa-folder-open fa-2x mb-2 d-block"></i>
                {% translate "This folder is empty." %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
