{% load i18n %}
<div class="p-3">
    {% if not is_root %}
    <div class="mb-3">
        <button class="btn btn-outline-secondary d-flex align-items-center" 
                hx-get="{% url 'navigate-folder' parent_folder %}" 
                hx-trigger="click" 
                hx-swap="innerHTML" 
                hx-target="#drive-files">
            <i class="fas fa-arrow-left me-2"></i> 
            {% translate "Back" %} 
        </button>
    </div>
    {% endif %}

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
        {% for data in drive %}
        <div class="col">
            <div class="card text-center shadow-sm h-100 drive-item" style="cursor: pointer;">
                <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                    {% if data.type == 'folder' %} 
                        <div class="drive-icon folder-icon text-warning w-100" 
                             hx-get="{% url 'navigate-folder' data.id %}" 
                             hx-trigger="click" 
                             hx-swap="innerHTML" 
                             hx-target="#drive-files">
                            <i class="fas fa-folder fa-3x"></i>
                        </div>
                    {% else %}
                        <div class="drive-icon file-icon text-muted w-100" data-id="{{ data.id }}">
                            <i class="fas fa-file-alt fa-3x"></i>
                        </div>
                    {% endif %}
                    <div class="card-title mt-2 w-100" style="word-wrap: break-word; font-size: 0.85rem;" title="{{ data.name }}">
                        {{ data.name }}
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-secondary text-center">
                <i class="fas fa-box-open fa-2x mb-2"></i><br>
                {% translate "This folder is empty." %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
