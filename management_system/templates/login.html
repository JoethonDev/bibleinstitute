{% load static %}
{% load crispy_forms_tags %}
{% load i18n %}

<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
    <!-- Change lang, dir depending on requests -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Institute Coptic</title>
    <style>
        body {
            background-image: url({% static 'login-bg.jpg' %});
            height: auto !important;
            display: flex;
            position: relative;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            flex-direction: column;
        }

        .login-container{
            background: white;
            /* min-width: 80%; */
            max-width: 450px;
            padding: 30px 20px;
            height: 550px;
            margin: 50px auto;
            border-radius: 20px;
        }

        img{
            display: block;
            margin: auto;
        }
    </style>
    <!-- CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Condition on RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-gXt9imSW0VcJVHezoNQsP+TNrjYXoGcrqBZJpry9zJt8PCQjobwmhMGaDHTASo9N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-fluid p-3">
        <form method="post" class="pt-5 pb-2 login-container">
            <a href="{% url 'home' %}" class="mb-2">
                <img src="{% static 'login-logo.png' %}" alt="">
            </a>
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" class="btn btn-primary d-block m-auto" value="تسجيل الدخول"> 
        </form>
    </div>

    <!-- <form action="{% url 'set_language' %}" method="post" class="container">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ redirect_to }}">
        <select name="language">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang in LANGUAGES %}
                <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
                    {{ lang.1 }}
                </option>
            {% endfor %}
        </select>
        <button type="submit">{% trans "Change language" %}</button>
    </form> -->
</body>
</html>
