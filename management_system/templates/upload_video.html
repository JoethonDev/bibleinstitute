{% extends 'admin_panel.html' %}
{% load i18n %}

{% block body %}
    <div id="content" class="d-flex flex-column h-100">

        <button class="btn btn-primary loading m-auto mb-3 w-50" type="button" disabled>
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span class="info">{% translate "Loading..." %}</span>
        </button>
        <div class="form col-12 col-md-8 col-lg-6 m-auto overflow-y-scroll p-2">
            <div class="mb-3">
                <label for="folder-name" class="form-label">{% translate "Folder" %}</label>
                <input class="form-control" type="text" id="folder-name" name="folder" dir=ltr>
            </div>
            <!-- <div id="drive-files" class="bg-light mb-5 w-100 vh-40 flex-grow-1 d-flex flex-column overflow-auto">
                {% include 'drive_files.html' %}
            </div> -->
            <!-- Drive Files Card -->
            <div class="card shadow-sm border-0 flex-grow-1">
                <div class="card-header">
                    <h6 class="mb-0">{% translate "Select Files from Drive" %}</h6>
                </div>
                <div id="drive-files" class="card-body overflow-auto" style="min-height: 300px;">
                    {% include 'drive_files.html' %}
                </div>
            </div>
            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">{% translate "Upload Files" %}</label>
                <input class="form-control" type="file" id="formFileMultiple" multiple>
            </div>
    
            <!-- Progress Bars -->
            <div id="progress-container">
                
            </div>
    
            <button class="btn btn-primary" id="upload-btn">{% translate "Upload Files" %}</button>
    
        </div>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.10.0/ffmpeg.min.js" xintegrity="sha512-tn8AWHJncCEEwBaiPJIqRYPujHs4MqlW+cisEO5PcM8Y6H/WtOaOAuRRzESgMm146midwwY24PkJvz9WIyn9lw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        
        <script>
            // Translations for JavaScript messages
            const jsTranslations_upload = {
                'en': {
                    'loading': 'Loading...',
                    'loaded': 'Loaded!',
                    'process': 'Process',
                    'upload': 'Upload',
                    'videoProcessingFailed': 'Video processing failed for',
                    'readingSegmentationFailed': 'Reading segmentation for {fileName} has failed',
                    'videoSegmentationFailed': 'Video segmentation failed',
                    'audioSegmentationFailed': 'Audio segmentation failed',
                    'failedToGetPresignedUrl': 'Failed to get presigned URL',
                    'uploadFailed': 'Upload failed',
                    'playlistUploadFailed': 'Playlist upload failed:',
                    'segmentUploadFailed': 'Segment {i} upload failed:',
                    'uploadProcessFailed': 'Upload process failed:'
                },
                'ar': {
                    'loading': 'جاري التحميل...',
                    'loaded': 'تم التحميل!',
                    'process': 'معالجة',
                    'upload': 'رفع',
                    'videoProcessingFailed': 'فشلت معالجة الفيديو لـ',
                    'readingSegmentationFailed': 'فشل قراءة التجزئة لـ {fileName}',
                    'videoSegmentationFailed': 'فشل تجزئة الفيديو',
                    'audioSegmentationFailed': 'فشل تجزئة الصوت',
                    'failedToGetPresignedUrl': 'فشل الحصول على رابط التحميل المسبق',
                    'uploadFailed': 'فشل الرفع',
                    'playlistUploadFailed': 'فشل رفع قائمة التشغيل:',
                    'segmentUploadFailed': 'فشل رفع الجزء {i}:',
                    'uploadProcessFailed': 'فشل عملية الرفع:'
                }
            };

            function getJsTranslation_upload(key, params = {}) {
                const lang = document.documentElement.lang || 'en';
                let message = jsTranslations_upload[lang][key] || jsTranslations_upload['en'][key];
                for (const param in params) {
                    message = message.replace(`{${param}}`, params[param]);
                }
                return message;
            }


            ffmpeg = null
            uploadBtn = document.getElementById("upload-btn")
            uploadBtn.addEventListener("click", async (e) => {
                await handleFiles(document.getElementById('formFileMultiple'))
            })
            progressField = document.getElementById('progress-container')
            folderName = document.getElementById("folder-name")

            function getCSRFToken(){
                let b = document.querySelector("body")
                let csrf = JSON.parse(b.getAttribute("hx-headers"))
                return csrf['X-CSRFToken']
            }

            function createFilePath(fileName) {
                fileName = fileName.split(".")[0]
                let value = folderName.value
                let folderValue = (value.endsWith("/")) ? value : `${value}/`
                return `${folderValue}${fileName}`
            }

            function createProgressBar(name, type){
                let outerDiv = document.createElement("div")
                outerDiv.className = "progress mb-3"
                outerDiv.style.height = "40px"

                // Insert Text
                progressField.insertAdjacentHTML("beforeend", `<h4>${getJsTranslation_upload(type)} ${name}</h4>`)

                // Progress Bar
                let progressBar = document.createElement("div")
                progressBar.innerHTML = "0%"
                progressBar.className = `progress-bar ${type}-${name}`
                progressBar.style.textAlign = "center"

                outerDiv.insertAdjacentElement("beforeend", progressBar)
                progressField.insertAdjacentElement("beforeend", outerDiv)
            }

            function updateProgressBar(progressBar, percent){
                let currentProgress = `${percent}%`
                progressBar.innerHTML = currentProgress
                progressBar.style.width = currentProgress
            }

            async function handleFiles(input) {
                const files = input.files;
                if (files.length === 0) return;

                // document.getElementById('progress-container').style.display = 'block';

                for (const file of files) {
                    console.log("Processing file:", file.name);
                    const fileName = file.name.split(" ").join("_")
                    const isVideo = file.type.startsWith("video/");
                    const fullFileName = file.name

                    
                    if (isVideo) {
                        try {
                            const fileData = await readFile(file)
                            // 2. Write file to FFmpeg FS
                            ffmpeg.FS('writeFile', fullFileName, fileData);

                            // Segment video and audio
                            const videoName = await segmentVideo(fullFileName);
                            const audioName = await segmentAudio(fullFileName);

                            // Read Segments
                            const videoSegments = await readSegments(videoName)
                            const audioSegments = await readSegments(audioName)

                            console.log("Segmentation Complete:", videoSegments.length, "segments created.");
                            await uploadSegments(videoSegments, videoName);
                            console.log("Segmentation Complete:", audioSegments.length, "segments created.");
                            await uploadSegments(audioSegments, audioName);
                        } catch (error) {
                            console.error(getJsTranslation_upload('videoProcessingFailed'), fileName, error);
                        } finally {
                            ffmpeg.FS("unlink", fullFileName)
                        }
                    } else {
                        // Process non-video files (PDF, images, etc.)
                        await uploadWholeFile(file, fileName);
                    }
                }
            }

            async function readFile(file) {
                const fileData = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(new Uint8Array(e.target.result));
                    reader.onerror = (e) => reject(e);
                    reader.readAsArrayBuffer(file);
                });
                return fileData
            }

            async function readSegments(fileName) {
                    try {
                        // Read generated files
                        const files = [];
                        // Add playlist file
                        const playlistFile = ffmpeg.FS("readFile", `${fileName}.m3u8`)
                        ffmpeg.FS('unlink', `${fileName}.m3u8`);

                        files.push(new Blob([playlistFile.buffer], { type: 'application/x-mpegURL' }));
                        
                        for (let i = 0; i < 1000; i++) {
                            const index = String(i).padStart(3, '0');
                            const filename = `${fileName}_${index}.ts`;
                            
                            try {
                                const data = ffmpeg.FS('readFile', filename);
                                files.push(new Blob([data.buffer], { type: "video/vnd.dlna.mpeg-tts" }));
                                // Clean up filesystem
                                ffmpeg.FS('unlink', filename);
                            } catch (e) {
                                break;
                            }
                        }

                        return files;
                    } catch (error) {
                        console.error('FFmpeg error:', error);
                        throw new Error(getJsTranslation_upload('readingSegmentationFailed', { fileName: fileName }));
                    }
            }
            
            async function segmentVideo(fullFileName) {
                try {
                    let fileName = `${fullFileName.split(".")[0]}_video`

                    // Create Progress Bar
                    createProgressBar(fileName, "process")

                    let progressClass = `process-${name}`
                    let progressBar = document.querySelector(`.process-${fileName}`)
                    // 3. Set progress handler
                    ffmpeg.setProgress(({ ratio }) => {
                        updateProgressBar(progressBar, Math.round(ratio * 100))
                    });


                    // 4. Run FFmpeg command with await
                    await ffmpeg.run(
                        '-i', fullFileName,
                        '-c', 'copy',          // Copy all streams without re-encoding
                        '-map', '0',           // Include all streams from input
                        '-f', 'hls',           // Use HLS format instead of generic segment
                        '-hls_time', '1',     // Segment duration in seconds
                        '-hls_list_size', '0', // Keep all segments in playlist
                        '-hls_segment_filename', `${fileName}_%03d.ts`, // TS file pattern
                        `${fileName}.m3u8`        // Main playlist file
                    );

                    return fileName
                } catch (error) {
                    console.error('FFmpeg error:', error);
                    throw new Error(getJsTranslation_upload('videoSegmentationFailed'));
                }
            }

            async function segmentAudio(fullFileName) {
                try {
                    const baseName = `${fullFileName.split(".")[0]}_audio`;

                    // Extract audio only and segment it
                    await ffmpeg.run(
                        '-i', fullFileName,
                        '-vn',                    // no video
                        '-acodec', 'aac',
                        '-b:a', '128k',
                        '-f', 'hls',
                        '-hls_time', '30',
                        '-hls_list_size', '0',
                        '-hls_segment_filename', `${baseName}_%03d.ts`,
                        `${baseName}.m3u8`
                    );

                    return baseName

                } catch (error) {
                    console.error(getJsTranslation_upload('audioSegmentationFailed'), error);
                    throw error;
                }
            }

            async function requestUploadUrl(fileName) {
                // 1. Get presigned URL from your Django backend
                const presignedResponse = await fetch('{% url "upload-link" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken(),
                    },
                    body: JSON.stringify({
                        filename: fileName
                    })
                });

                if (!presignedResponse.ok) {
                    throw new Error(getJsTranslation_upload('failedToGetPresignedUrl'));
                }

                return presignedResponse
            }

            async function uploadR2(filePath, file){
                const presignedResponse = await requestUploadUrl(filePath)

                // console.log(await presignedResponse.json())
                const { url, headers: presignedHeaders } = await presignedResponse.json();

                // 2. Create upload request with progress tracking
                const xhr = new XMLHttpRequest();
                

                // Upload completion handler
                const uploadPromise = new Promise((resolve, reject) => {
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve();
                        } else {
                            reject(new Error(getJsTranslation_upload('uploadFailed')));
                        }
                    };
                    xhr.onerror = () => reject(new Error(getJsTranslation_upload('networkError'))); // Assuming networkError is defined in translations
                });

                // Start upload
                xhr.open('PUT', url, true);
                xhr.send(file);

                await uploadPromise;
                
            }

            async function uploadSegments(files, fileName) {
                try {
                    
                    fileName = CSS.escape(fileName.split(".")[0])
                    const uploadResults = [];
                    createProgressBar(fileName, "upload")
                    let uploadBar = document.querySelector(`.upload-${fileName}`)
                    let filePath = createFilePath(fileName)

                    let playlist = files[0]
                    let playlistPath = `${filePath}.m3u8`
                    try {

                        await uploadR2(playlistPath, playlist)

                    } catch (error) {
                        console.error(getJsTranslation_upload('playlistUploadFailed'), error);
                        uploadResults.push({
                            status: 'failed',
                            error: error.message
                        });
                    }
                    
                    // Remove m3u8 from files
                    files.shift()
                    for (const [i, file] of files.entries()) {
                        try {
                            const index = String(i).padStart(3, '0');
                            const segmentPath = `${filePath}_${index}.ts`
                            await uploadR2(segmentPath, file)
                            uploadResults.push({
                                index,
                                status: 'success'
                            });
                            const percent = Math.round((uploadResults.length / files.length) * 100);
                            updateProgressBar(uploadBar, percent)

                        } catch (error) {
                            console.error(getJsTranslation_upload('segmentUploadFailed', { i: i }), error);
                            uploadResults.push({
                                index,
                                status: 'failed',
                                error: error.message
                            });
                        }
                    }

                    return uploadResults;

                } catch (error) {
                    console.error(getJsTranslation_upload('uploadProcessFailed'), error);
                    throw error;
                }
            }

            async function uploadWholeFile(file, fullFileName) {
                try {
                    const [fileName, ext] = fullFileName.split(".")
                    const uploadResults = [];
                    createProgressBar(fileName, "upload")
                    let uploadBar = document.querySelector(`.upload-${CSS.escape(fileName)}`)
                    let filePath = createFilePath(fileName)

                    let playlistPath = `${filePath}.${ext}`
                    try {

                        await uploadR2(playlistPath, file)
                        updateProgressBar(uploadBar, 100)

                    } catch (error) {
                        console.error(getJsTranslation_upload('playlistUploadFailed'), error);
                        uploadResults.push({
                            status: 'failed',
                            error: error.message
                        });
                    }
                    

                    return uploadResults;

                } catch (error) {
                    console.error(getJsTranslation_upload('uploadProcessFailed'), error);
                    throw error;
                }
            }    
        
            function removeR2Files(){
                document.querySelectorAll(".fa-file-alt").forEach(e => e.parentElement.parentElement.remove())
            }

            function modifyFolderInput(folderLink){
                let link = folderLink.split("/")
                let folderId = link[link.length - 2]
                let folderValue = folderId.split("-").join("/")
                if (folderValue == "None"){
                    folderValue = ""
                }
                document.getElementById("folder-name").value = decodeURI(folderValue)
            }

            function addFolderClick(){
                document.querySelectorAll(".fa-folder").forEach(e => {
                    e.addEventListener("click", (e) => {
                        let element = e.target
                        let folderLink = element.getAttribute("hx-get")
                        modifyFolderInput(folderLink)
                    })
                })
            }

            document.addEventListener("htmx:afterSettle", (event) => {
                if (!document.querySelector("#progress-container")){
                    return
                }
                console.log("Page is loaded!")
                const requestURL = event.detail.xhr.responseURL;
                console.log(event.detail.xhr.responseURL)
                if (!requestURL.endsWith("upload-files/")){
                    removeR2Files()
                    addFolderClick()
                    document.querySelector(".back-button")?.addEventListener("click", (e) => {
                        let element = e.target
                        let folderLink = element.getAttribute("hx-get")
                        modifyFolderInput(folderLink)
                    })
                    return
                }
                // console.log("HERE")
                window.location.reload()


            })

            window.addEventListener("DOMContentLoaded", () => {
                setTimeout( async () => {
                    const {createFFmpeg , fetchFile} = FFmpeg
                    ffmpeg = createFFmpeg({ log: true})
                    await ffmpeg.load()
                    button = document.querySelector(".loading")
                    button.classList.remove("btn-primary")
                    button.classList.add("btn-success")
                    button.querySelector(".spinner-border").remove()
                    button.querySelector(".info").innerText = getJsTranslation_upload('loaded');
                    }
                , 500)
                removeR2Files()
                addFolderClick()
                document.querySelector(".back-button")?.addEventListener("click", (e) => {
                    let element = e.target
                    let folderLink = element.getAttribute("hx-get")
                    modifyFolderInput(folderLink)
                })
            })

        </script>
    </div>
{% endblock %}
