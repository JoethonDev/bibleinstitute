{% load i18n static %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}"{% if request.LANGUAGE_CODE == 'ar' %} dir="rtl"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 · {% translate "Access denied." %}</title>
    <style>
        :root { color-scheme: light; --ink: #17303a; --teal: #2f5d73; --gold: #b4853a; --paper: #f7f3ea; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
        main { width: min(100%, 34rem); text-align: center; padding: 2.5rem 1.5rem; border: 1px solid rgba(23, 48, 58, .16); border-radius: 1.25rem; background: rgba(255, 255, 255, .78); box-shadow: 0 1rem 3rem rgba(23, 48, 58, .12); }
        img { width: 5rem; height: auto; margin-bottom: 1.25rem; }
        .code { margin: 0; color: var(--gold); font-size: clamp(3.5rem, 16vw, 6rem); font-weight: 800; line-height: .9; letter-spacing: .04em; }
        h1 { margin: 1rem 0 1.5rem; color: var(--teal); font-size: clamp(1.35rem, 5vw, 2rem); }
        a { display: inline-block; padding: .75rem 1.25rem; border-radius: .65rem; background: var(--teal); color: #fff; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    </style>
</head>
<body>
    <main aria-labelledby="error-title">
        <img src="{% static 'login-logo.png' %}?v={{ static_asset_version }}" alt="{% translate 'Logo' %}">
        <p class="code" aria-hidden="true">403</p>
        <h1 id="error-title">{% translate "Access denied." %}</h1>
        <a href="{% url 'home' %}">{% translate "Home" %}</a>
    </main>
</body>
</html>
