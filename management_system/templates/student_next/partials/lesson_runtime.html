{% load static %}
<link rel="stylesheet" href="{% static 'videojs/video-js.css' %}?v={{ static_asset_version }}">
<script defer src="{% static 'js/alpine/components/progressTracker.js' %}?v={{ static_asset_version }}"></script>
<script defer src="{% static 'vendor/pdfjs/3.11.174/pdf.min.js' %}?v={{ static_asset_version }}"></script>
<script defer src="{% static 'videojs/video.min.js' %}?v={{ static_asset_version }}"></script>
<script defer src="{% static 'videojs/videojs-seek-buttons.min.js' %}?v={{ static_asset_version }}"></script>
<script defer src="{% static 'js/lesson_media.js' %}?v={{ static_asset_version }}"></script>
<script>
document.addEventListener("alpine:init", function () {
  window.Alpine.data("progressTracker", progressTracker);
});
window.pdfViewerAssets = {
  workerSrc: "{% static 'vendor/pdfjs/3.11.174/pdf.worker.min.js' %}?v={{ static_asset_version }}",
  cMapUrl: "{% static 'vendor/pdfjs/3.11.174/cmaps/' %}",
  standardFontDataUrl: "{% static 'vendor/pdfjs/3.11.174/standard_fonts/' %}"
};
window.lessonMediaTranslations = { language: "{{ request.LANGUAGE_CODE|escapejs }}" };
</script>
