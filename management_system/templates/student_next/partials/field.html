{% load i18n %}
<div class="sn-field{% if field.errors %} has-errors{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
  <label class="sn-field-check" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
  <label class="sn-field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="sn-field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<ul class="sn-field-errors" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
