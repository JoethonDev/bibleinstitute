{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block style %}
<style>
    .container img {
        height: 300px !important;
    }

    .card{
        padding: 0% !important;
    }
</style>
{% endblock %}

{% block body %}
    <div class="container mt-5 p-2">
        {% for level in courses %}
            <div class="rounded mb-4">
                <h2 class="title">
                    {{ level.level_name }}
                </h2>
                <hr>
                <div class="row row-cols-3 justify-content-center justify-content-md-start ">
                    {% for course in level.courses %}                    
                        <!-- {% if forloop.counter0|divisibleby:3 or forloop.first %}
                        {% endif %} -->
                                <div class="card mb-3 col-10 col-xs-12 col-md-5 col-xl-3 mx-3">
                                    <a href="{% url 'course-details' course.id %}"> 
                                        <img src="{% static 'login-bg.jpg' %}" class="card-img-top">
                                    </a>
                                    <div class="card-body p-3 d-flex justify-content-between align-items-start flex-column">
                                        <h4>{{ course.name }}</h4>
                                        <a href="{% url 'course-details' course.id %}" class="btn btn-primary mt-4">
                                            {% translate 'See more' %}
                                        </a>
                                    </div>
                                </div>
                        <!-- {% if forloop.counter|divisibleby:3 or forloop.last %}
                        {% endif %} -->
                    {% endfor %}
                </div>

            </div>
        {% endfor %}
    </div>
{% endblock %}
