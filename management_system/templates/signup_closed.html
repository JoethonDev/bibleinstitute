{% extends 'base.html' %}
{% load i18n %}

{% block head_meta %}
<title>{{ closed_title }} | {% translate "Bible Institute Coptic" %}</title>
{% endblock %}

{% block body %}
<section class="sd-page">
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">

            <div class="sd-frame">
                <div class="sd-screen p-4 p-sm-5">

                    <div class="text-center mb-4">
                        <h1 class="sd-section-title">{{ closed_title }}</h1>
                        <p class="ps-muted-text">{{ closed_message|linebreaksbr }}</p>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{% url 'user_login' %}">{% translate "Already have an account? Log in" %}</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</section>
{% endblock %}
