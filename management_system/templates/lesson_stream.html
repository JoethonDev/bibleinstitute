{% extends "course_detail.html" %}
{% load i18n %}

{% block style %}
<style>
    /* Ensures the PDF canvas is responsive and maintains its aspect ratio */
    .pdf-viewer canvas {
        border: 1px solid #dee2e6;
        border-radius: 0.5rem;
    }
    /* Ensures the video player is responsive */
    .video-js.vjs-fluid,
    .video-js.vjs-16-9 {
        border-radius: 0.5rem;
        overflow: hidden;
    }
</style>
{% endblock %}

{% block content %}
<div id="content-loaded" class="p-2 p-md-3">
    {% for hls_url in links %}
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light">
                <h6 class="mb-0 fw-bold">{{ hls_url.name }}</h6>
            </div>
            <div class="card-body p-2 p-sm-3">
                {% if hls_url.type == 'video' %}
                    <!-- Responsive video container -->
                    <div>
                        <video playsinline controls class="video-js vjs-theme-city" preload="auto" controlsList="nodownload">
                            <source src="{{ hls_url.url }}" type="application/x-mpegURL"/>
                            <p class="vjs-no-js">
                            {% translate "To view this video please enable JavaScript, and consider upgrading to a web browser that" %}
                            <a href="https://videojs.com/html5-video-support/" target="_blank">{% translate "supports HTML5 video" %}</a>
                            </p>
                        </video>
                    </div>
                {% elif hls_url.type == 'audio' %}
                    <audio controls class="w-100" preload="auto" controlsList="nodownload">
                        <source src="{{ hls_url.url }}"/>
                    </audio> 
                {% else %}
                   <div class="d-flex justify-content-center">
                       <div class="pdf-viewer" data-url="{{ hls_url.url }}">
                            <canvas class="pdf-canvas shadow-sm"></canvas>
                            <div class="controls d-flex justify-content-between align-items-center mt-3">
                                <button class="prev btn btn-outline-secondary btn-sm"><i class="fas {% if request.LANGUAGE_CODE == 'en'  %}fa-arrow-left{% else %}fa-arrow-right{% endif %}"></i></button>
                                <span class="page-info mx-2 text-muted small">{% translate "Page" %} 1 / ?</span>
                                <button class="next btn btn-outline-secondary btn-sm"><i class="fas {% if request.LANGUAGE_CODE == 'en'  %}fa-arrow-right{% else %}fa-arrow-left{% endif %}"></i></button>
                            </div>
                       </div>
                   </div>
                {% endif %}
            </div>
        </div>
    {% endfor %}

        <script>
    (() => {
        // This IIFE runs every time this HTML fragment is swapped into the DOM.
        
        const jsTranslations_lesson = {
            'en': { 'page': 'Page' },
            'ar': { 'page': 'صفحة' }
        };

        function getJsTranslation_lesson(key) {
            const lang = document.documentElement.lang || 'en';
            return jsTranslations_lesson[lang][key] || jsTranslations_lesson['en'][key];
        }

        // --- LIFECYCLE MANAGEMENT ---
        // Clean up any existing Video.js players to prevent conflicts.
        // function disposeExistingPlayers() {
        //     const players = document.querySelectorAll('.video-js');
        //     players.forEach(videoEl => {
        //         // videojs.getPlayer is the safe way to get an instance
        //         const player = videojs.getPlayer(videoEl.id);
        //         if (player && !player.isDisposed()) {
        //             player.dispose();
        //         }
        //     });
        // }

        // --- INITIALIZATION FUNCTIONS ---
        function initializeVideoJs(video) {
            // Check if the element exists and hasn't been initialized
            if (video) {
                const player = videojs(video, {
                    controls: true,
                    fluid: true,
                    playbackRates: [0.5, 1, 1.5, 2],
                    controlBar: { volumePanel: true, playbackRateMenuButton: true, playToggle: true }
                });
                player.seekButtons({ forward: 10, back: 10 });
            }
        }

        function initializeHlsAudio(audio) {
            if (audio && !audio.hls) { // Simple check to prevent re-initialization
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    const source = audio.querySelector("source").src;
                    hls.loadSource(source);
                    hls.attachMedia(audio);
                    audio.hls = hls; // Mark as initialized
                }
            }
        }

        async function initializePdfViewer(viewer) {
            if (viewer && !viewer.pdfDoc) { // Prevent re-initialization
                const url = viewer.dataset.url;
                // ... (rest of PDF logic is fine, as it's self-contained)
                const canvas = viewer.querySelector(".pdf-canvas");
                const ctx = canvas.getContext("2d");
                const pageInfo = viewer.querySelector(".page-info");
                const prevBtn = viewer.querySelector(".prev");
                const nextBtn = viewer.querySelector(".next");
                let currentPage = 1;
                viewer.pdfDoc = true; // Mark as initialized immediately

                try {
                    const response = await fetch(url);
                    const result = await response.json();
                    const loadingTask = pdfjsLib.getDocument(result.url);
                    const pdfDoc = await loadingTask.promise;
                    
                    const renderPage = (num) => {
                        pdfDoc.getPage(num).then(page => {
                            canvas.height = 600; canvas.width = 400;
                            const viewportDefault = page.getViewport({ scale: 1 });
                            const scale = Math.min(canvas.width / viewportDefault.width, canvas.height / viewportDefault.height);
                            const viewport = page.getViewport({ scale: scale });
                            const tempCanvas = document.createElement('canvas');
                            const tempCtx = tempCanvas.getContext('2d');
                            tempCanvas.width = viewport.width; tempCanvas.height = viewport.height;
                            const renderContext = { canvasContext: tempCtx, viewport: viewport };
                            page.render(renderContext).promise.then(() => {
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                                const xOffset = (canvas.width - viewport.width) / 2;
                                const yOffset = (canvas.height - viewport.height) / 2;
                                ctx.drawImage(tempCanvas, xOffset, yOffset);
                            });
                            pageInfo.textContent = `${getJsTranslation_lesson('page')} ${num} / ${pdfDoc.numPages}`;
                        });
                    };

                    renderPage(currentPage);
                    prevBtn.addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderPage(currentPage); }});
                    nextBtn.addEventListener("click", () => { if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }});

                } catch (error) {
                    console.error("Error loading PDF:", error);
                    pageInfo.textContent = "Error loading PDF.";
                }
            }
        }
        
        // --- MAIN EXECUTION ---
        // 1. Dispose of any old players first.
        // disposeExistingPlayers();
        
        // 2. Initialize all new components.
        // A small timeout ensures the DOM is fully ready after the swap.
        setTimeout(() => {
            document.querySelectorAll('video.video-js').forEach(initializeVideoJs);
            document.querySelectorAll('audio').forEach(initializeHlsAudio);
            document.querySelectorAll('.pdf-viewer').forEach(initializePdfViewer);
            document.querySelectorAll('video, audio').forEach(el => {
                el.setAttribute('controlsList', 'nodownload');
                el.addEventListener('contextmenu', e => e.preventDefault());
            });
        }, 500);

        // Security measures
        document.addEventListener("keydown", e => {
            if ((e.ctrlKey && ["s", "p", "u"].includes(e.key.toLowerCase())) || e.key === "PrintScreen") {
                e.preventDefault();
            }
        });
        document.addEventListener("selectstart", e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
    })();
    </script>
</div>
{% endblock %}
