{% load i18n %}{% for message in messages %}
<div
    class="ps-toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    x-data="{ open: true }"
    x-show="open"
    x-init="setTimeout(() => { open = false; }, 2500)"
    hx-swap-oob="beforeend:#toast-stack"
>
    <i class="fas {% if message.level_tag == 'error' %}fa-times-circle{% elif message.level_tag == 'success' %}fa-check-circle{% elif message.level_tag == 'warning' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}" aria-hidden="true"></i>
    <span class="ps-toast-body">{{ message }}</span>
    <button
        type="button"
        class="ps-toast-close"
        @click="open = false"
        aria-label="{% translate 'Close' %}"
    ><i class="fas fa-times"></i></button>
</div>
{% endfor %}
