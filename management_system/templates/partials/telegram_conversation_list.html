{% load i18n %}
<div id="telegram-conversation-list"
     class="tg-chat-list"
     data-loaded-pages="1"
     data-poll-url="{{ conversation_list_url }}?fragment=items{% if pagination_query %}&amp;{{ pagination_query }}{% endif %}"
     x-data="{
         autoRefresh: true,
         polling: false,
         _timer: null,
         init() {
             this.$watch('autoRefresh', (value) => value ? this._start() : this._stop());
             if (this.autoRefresh) this._start();
         },
         destroy() { this._stop(); },
         _start() { if (!this._timer) this._timer = setInterval(() => this._poll(), 15000); },
         _stop() { if (this._timer) { clearInterval(this._timer); this._timer = null; } },
         _poll() {
             if (document.hidden || this.polling) return;
             const el = this.$el;
             if (!el.dataset.pollUrl) return;
             // Once older pages are appended, a page-1 poll would drop them.
             if (Number(el.dataset.loadedPages || '1') > 1) return;
             const list = el.querySelector('.tg-chat-conv-list');
             if (!list) return;
             if (!window.telegramChatBeginRequest?.(el)) return;
             this.polling = true;
             // Morph only the rows so avatars and row state are preserved and
             // the message thread is never touched by this refresh.
             htmx.ajax('GET', el.dataset.pollUrl, { target: list, swap: 'innerMorph' })
                 .then(() => window.telegramChatRebind?.(el))
                 .catch(() => {})
                 .finally(() => {
                     this.polling = false;
                     window.telegramChatEndRequest?.(el);
                 });
         }
     }">

    <div class="tg-chat-autorefresh">
        <label class="tg-chat-autorefresh-label">
            <input type="checkbox" x-model="autoRefresh">
            <span>{% translate "Auto refresh" %}</span>
        </label>
    </div>

    <ul class="tg-chat-conv-list list-unstyled mb-0">
        {% include 'partials/telegram_conversation_items.html' %}
    </ul>
</div>
