{% load i18n %}
<div id="telegram-conversation-list"
     class="tg-chat-list"
     data-loaded-pages="1"
     data-poll-url="{{ conversation_list_url }}?fragment=1{% if pagination_query %}&amp;{{ pagination_query }}{% endif %}"
     x-data="{
         autoRefresh: true,
         _timer: null,
         init() {
             this.$watch('autoRefresh', (value) => value ? this._start() : this._stop());
             if (this.autoRefresh) this._start();
         },
         destroy() { this._stop(); },
         _start() { if (!this._timer) this._timer = setInterval(() => this._poll(), 15000); },
         _stop() { if (this._timer) { clearInterval(this._timer); this._timer = null; } },
         _poll() {
             const el = this.$el;
             if (document.hidden) return;
             if (!el.dataset.pollUrl) return;
             if (Number(el.dataset.loadedPages || '1') > 1) return;
             htmx.ajax('GET', el.dataset.pollUrl, { target: el, swap: 'innerMorph' }).catch(() => {});
         }
     }">

    <div class="tg-chat-autorefresh">
        <label class="tg-chat-autorefresh-label">
            <input type="checkbox" x-model="autoRefresh">
            <span>{% translate "Auto refresh" %}</span>
        </label>
    </div>

    <ul class="tg-chat-conv-list list-unstyled mb-0">
        {% include 'partials/telegram_conversation_items.html' %}
    </ul>
</div>
