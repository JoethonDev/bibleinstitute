{% load i18n %}
<dialog class="pwa-push-dialog pwa-passkey-dialog" data-passkey-prompt
        data-options-url="{% url 'passkey-register-options' %}"
        data-verify-url="{% url 'passkey-register-verify' %}"
        aria-labelledby="pwa-passkey-dialog-title">
  <div class="pwa-push-dialog-card">
    <div class="pwa-push-dialog-head">
      <span class="pwa-push-dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
      </span>
      <div>
        <small class="pwa-push-dialog-eyebrow">{% translate "Security" %}</small>
        <h2 id="pwa-passkey-dialog-title">{% translate "Enable biometric sign-in" %}</h2>
      </div>
    </div>
    <p class="pwa-push-dialog-copy">{% translate "Use Face ID, fingerprint, Windows Hello or your device PIN to sign in without a password. Your biometric data never leaves your device." %}</p>
    <div class="pwa-push-dialog-actions">
      <button type="button" class="pwa-install-button" data-passkey-enable>{% translate "Enable biometrics" %}</button>
      <button type="button" class="pwa-push-dialog-later" data-passkey-close>{% translate "Later" %}</button>
    </div>
    <p class="pwa-push-dialog-status" data-passkey-prompt-status role="status" aria-live="polite"></p>
  </div>
</dialog>
