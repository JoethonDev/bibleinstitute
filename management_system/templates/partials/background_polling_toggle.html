{% load i18n %}
{% comment %}
Polling pause/resume control shared by the background-jobs and Telegram
broadcast monitor pages. Presentation only: the Alpine bindings, aria state,
data labels and translated text remain unchanged.
{% endcomment %}
<button type="button" class="aw-btn aw-btn--ghost" @click="togglePolling()" :aria-pressed="(!pollingEnabled).toString()" aria-pressed="false" data-pause-label="{% translate 'Pause updates' %}" data-resume-label="{% translate 'Resume updates' %}" x-text="pollingEnabled ? $el.dataset.pauseLabel : $el.dataset.resumeLabel">{% translate "Pause updates" %}</button>
<span class="aw-small aw-muted align-self-center" aria-live="polite" data-live-label="{% translate 'Live updates' %}" data-paused-label="{% translate 'Updates paused' %}" x-text="pollingEnabled ? $el.dataset.liveLabel : $el.dataset.pausedLabel"></span>
