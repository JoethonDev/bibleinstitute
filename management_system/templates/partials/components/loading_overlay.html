{% load i18n %}
<!-- Global Loading Overlay (Psalmodia) -->
<div 
    x-data="{ loading: false, pending: 0, timeoutId: null, isMajor(event) { return !event.detail || !event.detail.target || event.detail.target.id === 'display-page'; }, start(event) { if (!this.isMajor(event)) return; this.pending++; this.loading = true; clearTimeout(this.timeoutId); this.timeoutId = setTimeout(() => { this.pending = 0; this.loading = false; }, 12000); }, stop(event) { if (!this.isMajor(event)) return; this.pending = Math.max(0, this.pending - 1); if (!this.pending) { clearTimeout(this.timeoutId); this.timeoutId = null; this.loading = false; } } }"
    @htmx:before-request.window="start($event)"
    @htmx:after-request.window="stop($event)"
    x-show="loading"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="loading-overlay hidden-initially ps-loading-overlay position-fixed top-0 start-0 w-100 h-100"
    x-cloak
>
    <div class="d-flex align-items-center justify-content-center h-100">
        <div class="text-center">
            <div class="spinner-border text-light loading-spinner-lg ps-loading-spinner" role="status">
                <span class="visually-hidden">{% translate "Loading..." %}</span>
            </div>
            <div class="mt-3 text-white fw-bold">{% translate "Loading..." %}</div>
        </div>
    </div>
</div>
