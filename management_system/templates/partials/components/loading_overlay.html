{% load i18n %}
<!-- Global Loading Overlay -->
<div 
    x-data="{ loading: false }"
    @htmx:after-request.window="loading = false"
    @htmx:after-settle.window="loading = false"
    x-show="loading"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="position-fixed top-0 start-0 w-100 h-100"
    style="z-index: 9998; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); display: none;"
    x-cloak
>
    <div class="d-flex align-items-center justify-content-center h-100">
        <div class="text-center">
            <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">{% translate "Loading..." %}</span>
            </div>
            <div class="mt-3 text-white fw-bold">{% translate "Loading..." %}</div>
        </div>
    </div>
</div>

<style>
[x-cloak] { display: none !important; }
</style>
