{% load i18n %}

<!-- Desktop & Tablet Sidebar -->
<aside id="admin-sidebar" class="admin-sidebar ad-rail">
    
    <!-- Sidebar Header -->
    <div class="sidebar-header ad-rail-brand">
        <a href="{% url 'user-dashboard' %}" class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span x-show="!$store.ui.sidebarCollapsed" x-transition.opacity.duration.200ms>
                {% translate "Admin Panel" %}
            </span>
        </a>
        <button @click="$store.ui.toggleSidebar()" 
                class="btn-sidebar-toggle ad-btn ad-btn--ghost ad-btn--sm"
                :title="$store.ui.sidebarCollapsed ? '{% translate "Expand Sidebar" %}' : '{% translate "Collapse Sidebar" %}'"
                x-bind:aria-expanded="(!$store.ui.sidebarCollapsed).toString()"
                aria-controls="admin-sidebar">
            <i :class="$store.ui.sidebarCollapsed ? 'fas fa-angles-right' : 'fas fa-angles-left'"></i>
        </button>
    </div>
    
    <!-- Navigation Links -->
    <nav class="sidebar-nav">
        {% include 'partials/components/admin_nav_links.html' %}
    </nav>
    
    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
    </div>
</aside>

<!-- Mobile Offcanvas Menu -->
<div class="offcanvas offcanvas-start"
     tabindex="-1" 
     id="mobileAdminMenu"
     aria-labelledby="mobileAdminMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileAdminMenuLabel">
            <i class="fas fa-graduation-cap me-2"></i>
            {% translate "Admin Panel" %}
        </h5>
        <button type="button" 
                class="btn-close" 
                data-bs-dismiss="offcanvas" 
                aria-label="{% translate 'Close' %}"></button>
    </div>
    <div class="offcanvas-body">
        <nav>
            {% include 'partials/components/admin_nav_links.html' %}
        </nav>
        
        <hr class="my-3">
        
        <!-- User Info -->
        <div class="mt-3 p-3 ad-card-body">
            <small class="ps-muted-text d-flex align-items-center gap-2 text-truncate d-block"
                   title="{{ request.user.get_full_name|default:request.user.username }}">
                <i class="fas fa-user-circle"></i>
                {{ request.user.get_full_name|default:request.user.username }}
            </small>
        </div>
    </div>
</div>

<!-- Mobile Menu Toggle Button -->
<button class="ad-btn ad-btn--teal mobile-menu-toggle"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#mobileAdminMenu"
        aria-controls="mobileAdminMenu">
    <i class="fas fa-bars"></i>
</button>
