{% load i18n %}
{% if messages %}
<div class="ps-toast-stack ps-backend-messages" role="region" aria-live="polite">
    {% for message in messages %}
    <div
        class="ps-toast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        x-data="{ open: true }"
        x-cloak
        x-show="open"
        x-init="setTimeout(() => { open = false; }, 2500)"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform translate-x-0"
        x-transition:leave-end="opacity-0 transform translate-x-full"
    >
        <i class="fas {% if 'error' in message.tags %}fa-times-circle{% elif 'success' in message.tags %}fa-check-circle{% elif 'warning' in message.tags %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}" aria-hidden="true"></i>
        <span class="ps-toast-body">{{ message }}</span>
        <button
            type="button"
            class="ps-toast-close"
            @click="open = false"
            aria-label="{% translate 'Close' %}"
        ><i class="fas fa-times"></i></button>
    </div>
    {% endfor %}
</div>
{% endif %}
