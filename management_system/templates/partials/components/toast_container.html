{% load i18n %}
<!-- Toast Notifications Container -->
<div x-data class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    <template x-for="notification in $store.notifications.items" :key="notification.id">
        <div 
            class="toast show mb-2"
            :class="`border-${notification.type}`"
            role="alert" 
            aria-live="assertive" 
            aria-atomic="true"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-x-full"
            x-transition:enter-end="opacity-100 transform translate-x-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform translate-x-0"
            x-transition:leave-end="opacity-0 transform translate-x-full"
            style="min-width: 300px;"
        >
            <div class="toast-header" :class="`bg-${notification.type} text-white`">
                <i class="fas me-2" 
                   :class="{
                       'fa-check-circle': notification.type === 'success',
                       'fa-exclamation-circle': notification.type === 'warning',
                       'fa-times-circle': notification.type === 'danger',
                       'fa-info-circle': notification.type === 'info'
                   }"></i>
                <strong class="me-auto" x-text="notification.type.charAt(0).toUpperCase() + notification.type.slice(1)"></strong>
                <button 
                    type="button" 
                    class="btn-close btn-close-white" 
                    @click="$store.notifications.remove(notification.id)"
                    aria-label="Close"
                ></button>
            </div>
            <div class="toast-body" x-text="notification.message"></div>
        </div>
    </template>
</div>
