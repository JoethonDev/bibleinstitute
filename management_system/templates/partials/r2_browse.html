{% load i18n %}
<div class="ad-card-body">
{% if not is_root %}
<nav aria-label="{% translate 'Breadcrumb' %}" class="ad-drive-crumb mb-3">
    <a href="{% url 'r2-management-dashboard' %}"
       hx-get="{% url 'r2-management-dashboard' %}"
       hx-target="#file-list-container"
       hx-push-url="true">
        <i class="fas fa-home"></i> {% translate "Root" %}
    </a>
</nav>
{% endif %}

{% if not is_root %}
<div class="mb-3">
    <button class="ad-btn ad-btn--ghost"
            hx-get="{% if parent_folder %}{% url 'r2-management-dashboard' %}?folder={{ parent_folder|urlencode }}{% else %}{% url 'r2-management-dashboard' %}{% endif %}"
            hx-target="#file-list-container"
            hx-push-url="true">
        <i class="fas fa-arrow-left me-2"></i>
        {% translate "Back" %}
    </button>
</div>
{% endif %}

<div id="drive-files">
    {% include 'partials/r2_file_list.html' %}
</div>
{% if next_page_url %}
<div id="drive-next-sentinel"
     data-next-url="{{ next_page_url }}"
     role="button"
     tabindex="0"
     aria-label="{% translate 'Load more files' %}"
     class="drive-next-sentinel mt-3">
    <span class="drive-next-idle"><i class="fas fa-chevron-down me-1" aria-hidden="true"></i>{% translate "Load more files" %}</span>
    <span class="drive-next-loading"><span class="drive-next-spinner" aria-hidden="true"></span>{% translate "Loading more files…" %}</span>
</div>
{% endif %}
</div>
