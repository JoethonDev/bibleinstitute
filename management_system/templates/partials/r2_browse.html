{% load i18n %}
<div class="card-body">
{% if not is_root %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="#"
               hx-get="{% url 'r2-management-dashboard' %}"
               hx-target="#file-list-container"
               hx-push-url="true"
               class="text-decoration-none">
                <i class="fas fa-home"></i> {% translate "Root" %}
            </a>
        </li>
    </ol>
</nav>
{% endif %}

{% if not is_root %}
<div class="mb-3">
    <button class="btn btn-outline-secondary"
            hx-get="{% url 'r2-management-dashboard' %}?folder={{ parent_folder }}"
            hx-target="#file-list-container"
            hx-push-url="true">
        <i class="fas fa-arrow-left me-2"></i>
        {% translate "Back" %}
    </button>
</div>
{% endif %}

<div id="drive-files">
    {% include 'partials/r2_file_list.html' %}
</div>
</div>
