{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% translate "Attendance Scanner" %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-4">{% translate "Attendance Scanner" %}</h1>

  <div class="card">
    <div class="card-body">
      <p>{% translate "Enter or scan the QR token to record attendance." %}</p>
      <form id="scan-form">
        <div class="mb-3">
          <label for="token-input" class="form-label">{% translate "QR Token" %}</label>
          <input type="text" id="token-input" class="form-control form-control-lg" placeholder="{% translate "Paste or type QR token" %}" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">{% translate "Look up" %}</button>
      </form>
      <div id="scan-error" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>

  <div class="mt-3">
    <a href="{% url 'attendance-management' %}" class="btn btn-secondary">{% translate "Attendance Records" %}</a>
  </div>
</div>

<script>
document.getElementById('scan-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const token = document.getElementById('token-input').value.trim();
  const errorEl = document.getElementById('scan-error');
  if (!token) {
    errorEl.textContent = '{% translate "Please enter a token." %}';
    errorEl.classList.remove('d-none');
    return;
  }
  errorEl.classList.add('d-none');
  window.location.href = '/scan/' + encodeURIComponent(token) + '/';
});
</script>
</body>
</html>
