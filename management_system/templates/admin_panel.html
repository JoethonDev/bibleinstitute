{% load static %}
{% load crispy_forms_tags %}
{% load i18n %}


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta name="cross-origin-opener-policy" class="headers" content="same-origin">
    <meta name="cross-origin-embedder-policy" class="headers" content="require-corp">
    <meta name="cross-origin-resource-policy" class="headers" content="same-origin"> -->
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Resource-Policy" content="same-origin">
    <title>Bible Institute Coptic</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <!-- CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Condition on RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-gXt9imSW0VcJVHezoNQsP+TNrjYXoGcrqBZJpry9zJt8PCQjobwmhMGaDHTASo9N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- Style -->
    <style>
        .display-page {
            background-color: #f0f0f1;
            padding: 30px;
            min-height: 100vh;
            position: relative;
        }

        a {
          cursor: pointer;
        }

        .pointer-mouse{
          cursor: pointer;
        }

        .table-responsive{
          max-height: 70vh;
        }

        .vh-75{
          max-height: 75vh !important;
        }

        .overflow-y-scroll{
          overflow-y: scroll !important;
        }

        .me-90 {
          margin-right: 90% !important;
        }

        .pop-up {
          position: absolute;
          top: 10px;
          left: 0;
          opacity: 1;
          transition: opacity 5s ease-in-out;
        }

        .pop-up.hide {
          opacity: 0;
        }
        
        /* Lesson Form */
        #drive-files{
        padding: 20px;
        height: 50vh !important;
        }

        form{
            max-height: 50%;
        }

        form input.btn{
            width: fit-content;
        }

        .cards{
            overflow-y: scroll;
        }

        .card{
            height: 90px;
        }

        #videos-input{
            max-height: 70vh !important;
            overflow-y: scroll;
        }
        
        #videos-input .fa-xmark{
            position: absolute;
            color: red;
            top: 10px;
            left: 10px;
        }

        .video-container{
            position: relative;
        }

        .vh-50{
            max-height: 50vh;
        }

        .vh-40{
            max-height: 40vh !important;
        }
        
        .mw-50{
          max-width: 50%;
        }

        /* .questions-container {
          max-height: 70vh;
          overflow-y: scroll;
        } */

        .delete-question {
          position: absolute !important;
          top: 10px;
          left: 10px;
        }
        
        /* .w-100{
          width: 100%;
        } */
    </style>
    {% block style %}
    {% endblock %}
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        
        function removePopUp(alert) {
          setTimeout(() => {
            alert.classList.add("hide")
          }, 500)
          setTimeout(() => {
            alert.remove()
          }, 6000)
        }

        function displaySuccessAlert(e, msg="Item is deleted successfully!") {
          let divAlert = document.createElement("div")
          divAlert.className = "alert alert-success pop-up"
          divAlert.innerText = msg
          divAlert.style.width = "300px"
          document.querySelector("#display-page").append(divAlert)
          removePopUp(divAlert)
        }
    </script>

</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
      <div class="d-flex overflow-hidden">
        <div class="offcanvas offcanvas-start text-bg-dark bg-dark" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasDarkLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white" id="offcanvasDarkLabel">
              <a href="{% url 'admin-panel' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Admin Panel</span>
              </a>
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
              <hr>
              <ul class="nav nav-pills flex-column mb-auto">
                {% if request.user.role.role == "admin" %}
                  <li>
                    <a class="nav-link text-white" aria-current="page" 
                        hx-get="{% url 'user-dashboard' %}"
                        hx-trigger="click"
                        hx-target="#display-page"
                        hx-swap="innerHTML"
                        hx-push-url="true"
                        hx-select="#content">
                        <i class="fa-light fa-user-pen bi me-2" class="bi me-2" width="16" height="16"></i>
                        Users
                    </a>
                  </li>
                  <li>
                    <a class="nav-link text-white"
                        hx-get="{% url 'course-dashboard' %}"
                        hx-trigger="click"
                        hx-target="#display-page"
                        hx-swap="innerHTML"
                        hx-push-url="true"
                        hx-select="#content">
                      <i class="fa-light fa-book-open bi me-2"></i>
                      Courses
                    </a>
                  </li>
                  <li>
                    <a class="nav-link text-white"
                        hx-get="{% url 'lesson-dashboard' %}"
                        hx-trigger="click"
                        hx-target="#display-page"
                        hx-swap="innerHTML"
                        hx-push-url="true"
                        hx-select="#content">
                      <i class="fa-light fa-file-video bi me-2"></i>
                      Lessons
                    </a>
                  </li>
                  <li>
                    <a class="nav-link text-white"
                        hx-get="{% url 'upload-videos' %}"
                        hx-trigger="click"
                        hx-target="#display-page"
                        hx-swap="innerHTML"
                        hx-push-url="true"
                        hx-select="#content"
                        hx-refresh="true">
                      <i class="fa-light fa-file-video bi me-2"></i>
                      Upload Videos
                    </a>
                  </li>
                {% endif %}
  
                <li>
                  <a class="nav-link text-white"
                      hx-get="{% url 'quiz-dashboard' %}"
                      hx-trigger="click"
                      hx-target="#display-page"
                      hx-swap="innerHTML"
                      hx-push-url="true"
                      hx-select="#content">
                      <i class="fa-light fa-list-check bi me-2"></i>
                      Quizzes
                  </a>
                </li>
  
              </ul>
              <hr>
            
          </div>
        </div>

        <div class="display-page w-100">
          <button class="btn btn-primary mb-5" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
            Menu
          </button>
          <div id="display-page">
            {% block body %}
            {% endblock %}
          </div>
        </div>
      </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script> -->
      <script>
        offcanvasURLS = document.querySelectorAll(".nav-link")
        offcanvasURLS.forEach(element => {
          element.addEventListener("click", () => {
            document.querySelector(".btn-close").click()
          })
        });
      </script>
</body>
</html>
