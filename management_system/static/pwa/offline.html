<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Institute - Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e6;color:#163c46;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:34rem;padding:2rem;text-align:center}
    img{width:64px;height:64px}
    h1{font-size:1.5rem;margin:1rem 0 .5rem}
    p{line-height:1.8;color:#5b6b6f}
    a{display:inline-block;margin-top:1rem;padding:.7rem 1.1rem;border-radius:999px;background:#1f4f56;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/static/pwa/icons/icon-192.png" alt="">
    <h1>You are offline / لا يوجد اتصال</h1>
    <p>This page needs an internet connection. Your saved audio and PDF files are available in the Downloaded media page.<br>تحتاج هذه الصفحة إلى اتصال بالإنترنت. ملفاتك المحفوظة متاحة في صفحة الوسائط المحملة.</p>
    <a id="offline-library-link" href="/ar/offline-library/">Downloaded media / الوسائط المحملة</a>
  </main>
  <script>
    (function () {
      var arabic = (navigator.language || "ar").toLowerCase().indexOf("ar") === 0;
      if (document.referrer.indexOf("/ar/") !== -1) arabic = true;
      if (document.referrer.indexOf("/en/") !== -1) arabic = false;
      document.getElementById("offline-library-link").href = arabic ? "/ar/offline-library/" : "/en/offline-library/";
      document.documentElement.lang = arabic ? "ar" : "en";
      document.documentElement.dir = arabic ? "rtl" : "ltr";
    })();
  </script>
</body>
</html>
