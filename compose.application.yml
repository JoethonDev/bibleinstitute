# -- Application services: blue/green Django web slots + Celery worker --
# Infrastructure services (postgres, redis, nginx) live in
# compose.infrastructure.yml on the same external lms_network.

x-app-environment: &app-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
  POSTGRES_DB: ${POSTGRES_DB:-lms_database}
  POSTGRES_USER: ${POSTGRES_USER:-lms_user}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  SQLITE_SOURCE_PATH: /app/db.sqlite3
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  WEB_THREADS: ${WEB_THREADS:-8}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-1800}
  STATIC_ASSET_VERSION: ${STATIC_ASSET_VERSION:-dev}
  FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}

# Only the web slots and the general Celery worker need browser push/passkey
# configuration. The media and admin workers keep the base environment so the
# VAPID private key is not exposed to workers that never send browser push.
x-app-push-environment: &app-push-environment
  <<: *app-environment
  WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
  WEB_PUSH_TIMEOUT_SECONDS: ${WEB_PUSH_TIMEOUT_SECONDS:-15}
  WEB_PUSH_BATCH_SIZE: ${WEB_PUSH_BATCH_SIZE:-100}
  WEBAUTHN_ENABLED: ${WEBAUTHN_ENABLED:-false}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Bible Institute Coptic}
  WEBAUTHN_EXPECTED_ORIGIN: ${WEBAUTHN_EXPECTED_ORIGIN:-http://localhost:8000}
  WEBAUTHN_CHALLENGE_TTL_SECONDS: ${WEBAUTHN_CHALLENGE_TTL_SECONDS:-300}
  PWA_MEDIA_MAX_BYTES: ${PWA_MEDIA_MAX_BYTES:-0}

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
      format: raw
  environment: *app-environment
  volumes:
    - lms_static_data:/app/collectstatic
  networks:
    - lms_network

services:
  # -- Blue web slot ----------------------------------------------
  lms-app-blue:
    <<: *app-base
    environment: *app-push-environment
    command:
      - gunicorn
      - learning_platform.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --worker-class
      - gthread
      - --workers
      - ${WEB_CONCURRENCY:-2}
      - --threads
      - ${WEB_THREADS:-8}
      - --timeout
      - ${GUNICORN_TIMEOUT:-1800}
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.parse, urllib.request; configured=os.environ.get('DJANGO_SITE_DOMAIN', ''); host=urllib.parse.urlparse(configured).netloc or os.environ.get('DJANGO_ALLOWED_HOSTS', '').split(',')[0].strip() or 'localhost'; request=urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': host}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cpus: 1.0
    mem_limit: 1G

  # -- Green web slot ---------------------------------------------
  lms-app-green:
    <<: *app-base
    environment: *app-push-environment
    command:
      - gunicorn
      - learning_platform.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --worker-class
      - gthread
      - --workers
      - ${WEB_CONCURRENCY:-2}
      - --threads
      - ${WEB_THREADS:-8}
      - --timeout
      - ${GUNICORN_TIMEOUT:-1800}
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.parse, urllib.request; configured=os.environ.get('DJANGO_SITE_DOMAIN', ''); host=urllib.parse.urlparse(configured).netloc or os.environ.get('DJANGO_ALLOWED_HOSTS', '').split(',')[0].strip() or 'localhost'; request=urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': host}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cpus: 1.0
    mem_limit: 1G

  # -- Celery worker ----------------------------------------------
  celery:
    <<: *app-base
    environment: *app-push-environment
    command:
      - celery
      - -A
      - learning_platform
      - worker
      - --loglevel=INFO
      - --concurrency
      - ${CELERY_CONCURRENCY:-2}
    cpus: 0.5
    mem_limit: 1G

  # -- Media processing worker (dedicated FFmpeg queue) -----------
  # Runs native ffmpeg/ffprobe only for `media`-queue jobs (server-side FFmpeg
  # migration, proposal sections 15-16). Two jobs at a time with prefetch 1 so
  # both cores of the 2-CPU allowance stay busy: while one job uploads its
  # segments or waits on storage, the other encodes. Each video encode is
  # capped to the container CPU allowance (MEDIA_ENCODE_THREADS=0 derives it
  # from the cgroup quota, so a 2-CPU worker gets 2 threads instead of one
  # thread per host core), and one video job runs its audio deliverables beside
  # the video encode. The private named volume is mounted at MEDIA_WORK_DIR
  # only; it does not attach the shared lms_static_data volume. The environment
  # block below repeats x-app-base because a service-level `environment` key
  # replaces the anchored mapping in Compose YAML merge semantics; values are
  # identical to the anchor plus the MEDIA_* settings. The worker now always
  # re-encodes the HLS video (CRF quality target), so it is CPU-bound and needs
  # a real CPU allowance; the quota only applies while FFmpeg runs. Two
  # concurrent jobs need disk headroom for two staged sources plus their
  # segments; 2 GiB memory stays above two bounded job footprints.
  media-worker:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
      target: media
    command:
      - celery
      - -A
      - learning_platform
      - worker
      - --loglevel=INFO
      - --queues=media
      - --concurrency=${MEDIA_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_DB: ${POSTGRES_DB:-lms_database}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SQLITE_SOURCE_PATH: /app/db.sqlite3
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-1800}
      STATIC_ASSET_VERSION: ${STATIC_ASSET_VERSION:-dev}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      MEDIA_WORK_DIR: ${MEDIA_WORK_DIR:-/var/lib/lms-media-processing}
      MEDIA_MAX_SOURCE_SIZE: ${MEDIA_MAX_SOURCE_SIZE:-2147483648}
      MEDIA_MAX_DURATION_SECONDS: ${MEDIA_MAX_DURATION_SECONDS:-10800}
      MEDIA_JOB_TIMEOUT_SECONDS: ${MEDIA_JOB_TIMEOUT_SECONDS:-7200}
      MEDIA_SEGMENT_SECONDS: ${MEDIA_SEGMENT_SECONDS:-6}
      MEDIA_SOURCE_RETENTION_HOURS: ${MEDIA_SOURCE_RETENTION_HOURS:-24}
      MEDIA_FAILED_SOURCE_RETENTION_HOURS: ${MEDIA_FAILED_SOURCE_RETENTION_HOURS:-72}
      MEDIA_SUCCESSFUL_JOB_RETENTION_DAYS: ${MEDIA_SUCCESSFUL_JOB_RETENTION_DAYS:-90}
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      MEDIA_ENCODE_THREADS: ${MEDIA_ENCODE_THREADS:-0}
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-}
      MEDIA_VIDEO_CRF: ${MEDIA_VIDEO_CRF:-23}
      MEDIA_VIDEO_PRESET: ${MEDIA_VIDEO_PRESET:-fast}
      MEDIA_AUDIO_BITRATE: ${MEDIA_AUDIO_BITRATE:-128k}
    volumes:
      - media_processing_data:${MEDIA_WORK_DIR:-/var/lib/lms-media-processing}
    # On redeploy Docker sends SIGTERM; the Celery shutdown hook returns this
    # container's in-flight jobs to the queue and the aborted tasks delete their
    # partial R2 outputs. The longer stop window lets that cleanup finish
    # instead of leaving objects that the retry would report as a collision.
    stop_grace_period: 60s
    cpus: 2.0
    mem_limit: 2G

  # -- Durable management-operation worker (isolated admin queue) --
  # Population-sized calculations, promotions, imports, exports and storage
  # work run here at concurrency 1 / prefetch 1 (configurable). Keeping this
  # pool separate preserves web, default-worker, OTP and media latency.
  admin-worker:
    <<: *app-base
    command:
      - celery
      - -A
      - learning_platform
      - worker
      - --loglevel=INFO
      - --queues=admin
      - --concurrency=${ADMIN_WORKER_CONCURRENCY:-1}
      - --prefetch-multiplier=1
    cpus: 1.0
    mem_limit: 1G

  # -- Celery beat (bounded media recovery schedule) --------------
  celery-beat:
    <<: *app-base
    command:
      - celery
      - -A
      - learning_platform
      - beat
      - --loglevel=INFO
    volumes: []
    cpus: 0.1
    mem_limit: 256M

volumes:
  lms_static_data:
    external: true
  # Private disposable processing disk for the media worker; separate from
  # static files and R2 data and mounted only at MEDIA_WORK_DIR.
  media_processing_data:

networks:
  lms_network:
    external: true
